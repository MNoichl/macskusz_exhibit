name: Clean deployed Pages artifacts

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages", "pages build and deployment"]
    types: [completed]

permissions:
  actions: write

jobs:
  cleanup:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the completed run's Pages upload
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { ...context.repo, run_id: run.id, per_page: 100 }
            );
            for (const artifact of artifacts) {
              if (artifact.name !== 'github-pages' || artifact.expired) continue;
              try {
                await github.rest.actions.deleteArtifact({
                  ...context.repo, artifact_id: artifact.id
                });
                core.info(`Deleted deployed Pages artifact ${artifact.id} (${artifact.size_in_bytes} bytes)`);
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info(`Artifact ${artifact.id} was already removed`);
              }
            }
